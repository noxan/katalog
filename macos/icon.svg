<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed artwork: macOS applies the platform icon mask itself. An
       inset rounded rectangle gets masked a second time and shows up as a
       pale/white border in the Dock and Finder. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Open book, sized to the prominent central-glyph proportions used by
       native macOS icons rather than floating as a small mark in the canvas. -->
  <g transform="translate(512 512) scale(1.35) translate(-512 -512)">
    <!-- left page -->
    <path d="M512 372
             Q396 320 300 356
             L300 636
             Q396 600 512 652 Z"
          fill="#F8FAFC"/>
    <!-- right page -->
    <path d="M512 372
             Q628 320 724 356
             L724 636
             Q628 600 512 652 Z"
          fill="#E2E8F0"/>
    <!-- center spine -->
    <rect x="504" y="372" width="16" height="280" rx="8" fill="#CBD5E1"/>
    <!-- text lines -->
    <g stroke="#C7D2FE" stroke-width="14" stroke-linecap="round">
      <line x1="352" y1="430" x2="470" y2="452"/>
      <line x1="352" y1="486" x2="470" y2="508"/>
      <line x1="352" y1="542" x2="470" y2="564"/>
    </g>
    <g stroke="#A5B4FC" stroke-width="14" stroke-linecap="round">
      <line x1="554" y1="452" x2="672" y2="430"/>
      <line x1="554" y1="508" x2="672" y2="486"/>
      <line x1="554" y1="564" x2="672" y2="542"/>
    </g>
  </g>
</svg>
