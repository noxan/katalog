[package]
name = "katalog-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "katalog"
# staticlib/cdylib for the Swift framework; lib so `cargo test` and bindgen work.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
rbook = "0.7"
mobi = "0.8"
# Only the codecs we need — decode epub images, re-encode oversized ones as JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
tempfile = "3"
# Tests inspect the raw OCF container (OPF bytes, mimetype-first/STORED invariant).
zip = "8"

[[bin]]
# uniffi-bindgen CLI, invoked by build-core.sh to emit Swift bindings.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
